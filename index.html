<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>境界门诊：王国维的AI解忧杂货铺</title>
    <style>
        :root {
            --bg: #F4F1EA; 
            --ink: #2C3E50; 
            --red: #8E2323; 
            --card: #FFFFFF;
        }
        
        /* 全局背景音乐开关 */
        .music-btn {
            position: fixed; top: 20px; right: 20px;
            width: 50px; height: 50px; border-radius: 50%;
            background: var(--ink); color: white;
            display: flex; justify-content: center; align-items: center;
            font-size: 24px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            z-index: 999; transition: 0.3s;
        }
        .music-btn.playing { background: var(--red); animation: spin 4s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        body {
            font-family: "KaiTi", "楷体", "STKaiti", serif;
            background-color: var(--bg); color: var(--ink);
            margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
        }
        h1 { font-size: 28px; letter-spacing: 2px; margin-bottom: 5px; }
        .subtitle { font-size: 14px; color: #666; margin-bottom: 20px; }

        .container {
            width: 100%; max-width: 650px; background: var(--card);
            padding: 30px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border: 1px solid #E0DCD3; position: relative; margin-bottom: 50px;
        }
        .stamp {
            position: absolute; top: 20px; right: 20px;
            border: 2px solid var(--red); color: var(--red);
            padding: 4px 8px; font-size: 12px; font-weight: bold;
            transform: rotate(15deg); opacity: 0.7; border-radius: 4px;
        }

        textarea {
            width: 100%; height: 120px; padding: 15px;
            border: 1px solid #ccc; border-radius: 8px;
            font-family: inherit; font-size: 16px; resize: none; box-sizing: border-box;
            background-color: #F9F9F9; line-height: 1.6;
        }
        textarea:focus { outline: none; border-color: var(--ink); }

        .btn {
            width: 100%; padding: 15px; margin-top: 15px;
            background-color: var(--ink); color: white;
            border: none; border-radius: 8px; font-size: 18px;
            cursor: pointer; font-family: inherit; transition: 0.3s;
        }
        .btn:hover { background-color: #1A252F; }

        #result { margin-top: 30px; display: none; border-top: 2px dashed #ccc; padding-top: 20px; animation: fadeIn 0.8s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .prescription-card {
            background: #FAFAFA; border: 1px solid #E0DCD3; border-radius: 8px;
            padding: 25px; margin-bottom: 25px; position: relative;
        }
        .card-number {
            position: absolute; top: -10px; left: 20px;
            background: var(--red); color: white;
            padding: 2px 12px; border-radius: 12px; font-size: 13px;
        }
        .quote { font-size: 22px; font-weight: bold; text-align: center; margin: 20px 0 10px; padding: 15px; background: #F4F1EA; border-radius: 6px; line-height: 1.4; }
        .source { text-align: center; font-size: 14px; color: #666; margin-bottom: 20px; }
        .section-title { font-weight: bold; font-size: 17px; margin-top: 20px; margin-bottom: 8px; color: var(--red); }
        .content-text { font-size: 16px; line-height: 1.8; margin-bottom: 15px; text-align: justify; }
        
        /* 颜色小圆圈 */
        .color-dot {
            display: inline-block; 
            width: 18px; 
            height: 18px; 
            border-radius: 50%; 
            vertical-align: text-bottom; 
            margin-right: 8px;
            border: 1px solid #333;
            box-shadow: 1px 1px 3px rgba(0,0,0,0.2);
        }

        .music-link { color: #1E90FF; text-decoration: none; border-bottom: 1px dashed #1E90FF; font-weight: bold; }
        .music-link:hover { color: var(--red); border-bottom-color: var(--red); }
    </style>
</head>
<body>

       <audio id="bgMusic" loop>
        <source src="time.mp3" type="audio/mpeg">
    </audio>
    <div class="music-btn" id="musicBtn" onclick="toggleMusic()">🎵</div>

    <h1>境界门诊 · AI解忧杂货铺</h1>
    <div class="subtitle">输入你的困惑，请王国维先生为你多维开药</div>

    <div class="container">
        <div class="stamp">境界全开</div>
        <textarea id="userInput" placeholder="例如：我和朋友吵架了，觉得很委屈，不想理他了；或者：最近写论文一直失败，感觉自己很没用……"></textarea>
        <button class="btn" onclick="diagnose()">开启词话扫描</button>

        <div id="loading" style="display:none; text-align:center; margin-top:20px; font-style:italic;">正在检索核心词库并寻找情绪关联…</div>

        <div id="result">
            <!-- 删除了所有AI理解的废话区域，直接出卡片 -->
            <div id="prescriptions-container"></div>
        </div>
    </div>

    <script>
        // 精准词库：包含“why”字段，专门解释词话与情绪的关联
        const database = [
            // 1. 人际冲突/吵架
            { 
                k:['吵架','朋友','人际','委屈','生气','愤怒','绝交','误解'], 
                q:'“以我观物，故物皆著我之色彩。”', 
                s:'第3条 · 有我之境', 
                a:'当你带着主观情绪去看待事物时，万物都会染上你的喜怒哀乐。此刻，你眼中的朋友，已经被你的愤怒“染色”了。',
                why:'为什么这句词能对应你的情绪？因为你此刻觉得对方面目可憎、不可理喻，其实很大程度上是因为你戴上了“委屈”的滤镜。词话精准地命中了你们冲突的本质：你们不是在和真实的人吵架，而是在和彼此的主观情绪打架。明白了这一点，你就能从情绪的泥沼中拔出腿来。',
                c:'朱砂红', hex:'#B33B33', m:'陈奕迅《不要说话》', mu:'https://music.163.com/#/search/m/?s=陈奕迅+不要说话', 
                ac:'不要急着去争论对错。先去喝杯水，或者洗把脸。等情绪的“色彩”褪去，再问问自己：这段关系，我还想挽回吗？' 
            },
            // 2. 精神内耗/钻牛角尖
            { 
                k:['内耗','纠结','钻牛角尖','完美','放不下','走不出来'], 
                q:'“诗人对宇宙人生，须入乎其内，又须出乎其外。”', 
                s:'第60条', 
                a:'入乎其内，是去体验和共情；出乎其外，是保持理智与距离。你现在把自己死死困在了局中。',
                why:'你的情绪之所以被这句词宽解，是因为它直接指出了你的病灶——你“入”得太深，忘了“出”。你把一件小事无限放大了。这句话在提醒你：跳出来看！站在五年后再看今天，这件让你辗转反侧的事，其实根本不值一提。',
                c:'天青蓝', hex:'#8CB4C8', m:'林俊杰《不为谁而作的歌》', mu:'https://music.163.com/#/search/m/?s=林俊杰+不为谁而作的歌', 
                ac:'立刻停止脑内的小剧场！穿上鞋出门，去楼下看看天空或者高大的树木。用物理空间的开阔，去治愈你心里的狭窄。' 
            },
            // 3. 科研/工作/学业受挫
            { 
                k:['科研','论文','失败','没结果','工作','难','卷','加班','累','坚持'], 
                q:'“衣带渐宽终不悔，为伊消得人憔悴。”', 
                s:'第26条 · 第二境', 
                a:'这是为了目标死磕的阶段。你掉过的头发、熬过的夜，都是在为未来积蓄力量。',
                why:'你此刻的疲惫和无力感，被这句词精准地接住了。王国维将这定义为“成大事业者的第二境界”，这意味着你现在的痛苦不是因为你无能，而是因为你在爬坡。这句话把你当下的“挫败感”，转换成了“奋斗的勋章”，让你觉得所有的辛苦都是值得的。',
                c:'深空灰', hex:'#4B4E54', m:'陈奕迅《孤勇者》', mu:'https://music.163.com/#/search/m/?s=陈奕迅+孤勇者', 
                ac:'不要因为今天跑不出数据就否定自己。今晚必须停工！去洗个热水澡，把手机静音，给自己放个假。' 
            },
            // 4. 迷茫/未来焦虑
            { 
                k:['迷茫','未来','不知道','孤独','无助','毕业','找工作','选择困难'], 
                q:'“昨夜西风凋碧树。独上高楼，望尽天涯路。”', 
                s:'第26条 · 第一境', 
                a:'迷茫是清醒的开始。你必须先忍受孤独地站到高处去眺望，才能在千万条路中找到属于自己的那一条。',
                why:'当你不知道未来在哪时，这种焦虑感几乎要把你吞噬。但这句词告诉你：孤独和迷茫并不是你的错，而是“觉醒”前的阵痛。你之所以焦虑，是因为你不愿意随波逐流。词话将你的“无助感”升华为一种“独自登高”的孤勇。',
                c:'晨雾白', hex:'#E3E6E8', m:'逃跑计划《夜空中最亮的星》', mu:'https://music.163.com/#/search/m/?s=逃跑计划+夜空中最亮的星', 
                ac:'别想太远的未来了。拿出一张纸，写下你这周只做一件事的“小目标”。去完成它，用微小的掌控感去对抗巨大的虚无。' 
            },
            // 5. 失恋/遗憾/失去
            { 
                k:['失恋','分手','前任','遗憾','错过','失去','怀念','想他'], 
                q:'“最是人间留不住，朱颜辞镜花辞树。”', 
                s:'引王国维《蝶恋花》', 
                a:'青春易逝，花开花落，这是宇宙不可逆转的客观规律。有些人的出现，注定只是为了陪你走一段路。',
                why:'你之所以痛苦，是因为你的执念在和“规律”对抗。你执着于“永远拥有”，但这句话无情又温柔地告诉你：连最美好的青春和容颜都留不住，何况是一个人呢？它让你明白，失去才是人生的常态，从而宽解了你对“失去”的恐惧。',
                c:'琥珀黄', hex:'#D8A35C', m:'林宥嘉《说谎》', mu:'https://music.163.com/#/search/m/?s=林宥嘉+说谎', 
                ac:'去整理一下旧物，把前任的礼物、旧照片全部打包收起来，或者扔掉。给自己一个全新的开始。' 
            },
            // 6. 伪装/自卑/攀比
            { 
                k:['伪装','朋友圈','自卑','不如别人','做作','攀比'], 
                q:'“能写真景物、真感情者，谓之有境界。”', 
                s:'第6条', 
                a:'卸下伪装，直面内心最真实的感受时，你本身就是有境界的。伪装出来的强大，终究只是空中楼阁。',
                why:'你在社交中感到疲惫，是因为你戴着面具，害怕别人看穿你的脆弱。王国维告诉你，最有力量的武器是“真”。这句词是在接纳你的自卑，它告诉你：当你敢于承认自己的不足、敢于展示真实的脆弱时，你反而会获得真正的轻松。',
                c:'珍珠白', hex:'#FDFEFE', m:'莫文蔚《慢慢喜欢你》', mu:'https://music.163.com/#/search/m/?s=莫文蔚+慢慢喜欢你', 
                ac:'今天不要发那些精心修饰的朋友圈了。试着发一条最真实的动态，或者干脆关掉手机，去读一本好书。' 
            },
            // 7. 熬夜/失眠
            { 
                k:['熬夜','失眠','睡不着','作息','日夜颠倒'], 
                q:'“无我之境，以物观物，故不知何者为我，何者为物。”', 
                s:'第3条 · 无我之境', 
                a:'进入无我之境，是治愈失眠的良药。忘记白天的烦恼，忘记明天的任务，只把自己当成一呼一吸的客观存在。',
                why:'你睡不着，是因为你脑子里的“我”太活跃了，焦虑、后悔全都挤在脑子里。这句词与你失眠的关联在于：它教你如何“关闭”那个焦虑的自我。试着把“我”放下，只去感受枕头的触感。心静了，自然就睡着了。',
                c:'深夜蓝', hex:'#1B2631', m:'白噪音《雨声》', mu:'https://music.163.com/#/search/m/?s=白噪音+雨声', 
                ac:'今晚11点前，把手机放到远离床铺的地方充电。闭上眼睛，放一段雨声白噪音，把注意力全放在呼吸上。' 
            }
        ];

        // 音乐控制
        const music = document.getElementById('bgMusic');
        const musicBtn = document.getElementById('musicBtn');
        let isPlaying = false;
        
        document.body.addEventListener('click', function initAudio() {
            if(!isPlaying) {
                music.play().then(() => { isPlaying = true; musicBtn.classList.add('playing'); }).catch(e=>{});
                document.body.removeEventListener('click', initAudio);
            }
        }, { once: true });

        function toggleMusic() {
            if (isPlaying) {
                music.pause(); musicBtn.classList.remove('playing'); isPlaying = false;
            } else {
                music.play().catch(e=>{}); musicBtn.classList.add('playing'); isPlaying = true;
            }
        }

        // 诊断逻辑
        function diagnose() {
            const input = document.getElementById('userInput').value.trim();
            if (!input) { alert("请描述一下你的困惑哦~"); return; }

            const loading = document.getElementById('loading');
            const result = document.getElementById('result');
            const container = document.getElementById('prescriptions-container');

            result.style.display = 'none';
            loading.style.display = 'block';
            container.innerHTML = '';

            setTimeout(() => {
                let scoredItems = database.map(item => {
                    let score = 0;
                    item.k.forEach(kw => { if (input.includes(kw)) score++; });
                    return { item, score };
                });

                scoredItems.sort((a, b) => b.score - a.score);
                
                let matchedItems = scoredItems.filter(x => x.score > 0).map(x => x.item);
                
                if (matchedItems.length === 0) {
                    matchedItems = database.sort(() => 0.5 - Math.random()).slice(0, 2);
                }

                let finalItems = matchedItems.slice(0, 3); 

                finalItems.forEach((item, index) => {
                    let card = `
                        <div class="prescription-card">
                            <div class="card-number">处方 0${index + 1}</div>
                            <div class="quote">${item.q}</div>
                            <div class="source">—— 《人间词话》${item.s}</div>
                            
                            <div class="section-title">📖 【原句解析】</div>
                            <div class="content-text">${item.a}</div>
                            
                            <div class="section-title">🔗 【词话与情绪的关联】</div>
                            <div class="content-text" style="color: #8E2323; font-weight: bold;">${item.why}</div>
                            
                            <div class="section-title">🎨 【视觉处方】</div>
                            <div class="content-text">
                                <span class="color-dot" style="background-color:${item.hex};"></span> 
                                <b>${item.c}</b>：注视身边这个颜色的物品3秒，深呼吸，让心静下来。
                            </div>
                            
                            <div class="section-title">🎵 【听觉处方】</div>
                            <div class="content-text">推荐聆听：<a class="music-link" href="${item.mu}" target="_blank">${item.m}</a></div>
                            
                            <div class="section-title">💡 【行动处方】</div>
                            <div class="content-text">${item.ac}</div>
                        </div>
                    `;
                    container.innerHTML += card;
                });

                loading.style.display = 'none';
                result.style.display = 'block';
                window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });

            }, 1000); 
        }
    </script>
</body>
</html>
